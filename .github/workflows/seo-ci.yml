name: SEO & Metadata CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-seo:
    name: Validate SEO, Sitemaps & Metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SEO & Metadata Validator
        run: |
          python scripts/validate_seo.py
